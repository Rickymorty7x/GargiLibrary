name: Feature request
description: Suggest an improvement or lawful search source
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Include API documentation and usage terms for a new search provider.
    validations:
      required: true
